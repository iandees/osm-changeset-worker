<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM Changeset Viewer</title>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="ph ph-map-trifold"></i> OSM Changeset Viewer</h1>
                <p class="subtitle">Explore OpenStreetMap changesets in real-time</p>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filters-header" id="filtersHeader">
                    <h2>Filters</h2>
                    <div class="filters-summary" id="filtersSummary"></div>
                    <button class="filters-toggle" id="filtersToggle" aria-label="Toggle filters">
                        <span class="toggle-icon"><i class="ph ph-caret-down"></i></span>
                    </button>
                </div>
                <div class="filters-content" id="filtersContent">
                    <div class="filter-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Filter by username..." />
                    </div>

                    <div class="filter-group">
                        <label for="tags">Tags</label>
                        <input type="text" id="tags" placeholder='e.g., comment=test, source!=survey, key~value' />
                        <small style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem; display: block;">
                            Format: key=value, key!=value, or key~value (partial match)
                        </small>
                    </div>

                    <div class="filter-group">
                        <label>Bounding Box</label>
                        <div id="bboxDisplay" class="bbox-display">
                            <span class="bbox-placeholder">Draw on map or enter coordinates</span>
                        </div>
                        <div class="bbox-inputs" style="display: none;">
                            <input type="number" id="bboxMinLon" placeholder="Min Lon" step="0.0001" />
                            <input type="number" id="bboxMinLat" placeholder="Min Lat" step="0.0001" />
                            <input type="number" id="bboxMaxLon" placeholder="Max Lon" step="0.0001" />
                            <input type="number" id="bboxMaxLat" placeholder="Max Lat" step="0.0001" />
                        </div>
                        <button id="drawBbox" class="btn btn-secondary" style="margin-bottom: 0.5rem;">
                            <i class="ph ph-bounding-box"></i> Draw Bounding Box on Map
                        </button>
                        <button id="useMapBounds" class="btn btn-secondary" style="margin-bottom: 0.5rem;">
                            <i class="ph ph-eye"></i> Use Current View
                        </button>
                        <button id="clearBbox" class="btn btn-secondary" style="display: none;">
                            <i class="ph ph-x"></i> Clear Bounding Box
                        </button>
                    </div>

                    <div class="bbox-size-row">
                        <div class="filter-group bbox-size-group">
                            <label for="bboxSizeMin">Min Size (sq deg)</label>
                            <input type="number" id="bboxSizeMin" placeholder="e.g., 0.001" step="0.001" min="0" />
                        </div>

                        <div class="filter-group bbox-size-group">
                            <label for="bboxSizeMax">Max Size (sq deg)</label>
                            <input type="number" id="bboxSizeMax" placeholder="e.g., 1.0" step="0.001" min="0" />
                        </div>
                    </div>

                    <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                    <button id="clearFilters" class="btn btn-secondary">Clear</button>
                </div>
            </div>

            <!-- Changeset List -->
            <div class="changeset-list">
                <div class="changeset-list-header-container">
                    <h2 id="changesetListHeader">Changesets</h2>
                    <div class="header-actions">
                        <button id="refreshData" title="Refresh data" class="btn-refresh">
                            <i class="ph ph-arrows-clockwise"></i>
                        </button>
                        <a id="rssLink" href="#" target="_blank" title="RSS Feed"><i class="ph ph-rss"></i></a>
                    </div>
                </div>
                <div id="loadNewContainer" class="load-new-container" style="display: none;">
                    <button id="loadNewBtn" class="btn btn-secondary btn-sm">Load New Changesets</button>
                </div>
                <div id="changesetItems" class="changeset-items">
                    <div class="loading">Loading changesets...</div>
                </div>
                <div id="loadMoreContainer" class="load-more-container" style="display: none;">
                    <button id="loadMoreBtn" class="btn btn-secondary btn-sm">Load More</button>
                </div>
            </div>
        </aside>

        <!-- Map -->
        <main class="map-container">
            <button class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle sidebar">
                <i class="ph ph-list"></i>
            </button>
            <div id="map"></div>
            <div class="map-controls">
                <button id="fitBounds" class="btn btn-icon" title="Fit all changesets">
                    <i class="ph ph-corners-out"></i>
                </button>
            </div>

            <!-- Changeset Detail Panel / Bottom Sheet -->
            <div id="changesetDetailPanel" class="changeset-detail-panel">
                <div class="bottom-sheet-handle" id="bottomSheetHandle">
                    <div class="bottom-sheet-handle-bar"></div>
                </div>
                <div class="bottom-sheet-peek" id="bottomSheetPeek">
                    <span class="bottom-sheet-peek-text" id="bottomSheetPeekText"></span>
                </div>
                <button id="closePanel" class="panel-close-btn"><i class="ph ph-x"></i></button>
                <div id="panelContent" class="bottom-sheet-content"></div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <script src="/app.js"></script>
</body>
</html>
